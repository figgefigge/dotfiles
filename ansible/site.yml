---
- name: Configure Linux workstation
  hosts: workstation
  become: true

  vars_files:
    - vars.yml

  roles:
    - base
    - security
    - tailscale
    - firewall
    - role: server
      when: >-
        (ansible_facts['os_family'] == 'Debian' and server_apply_to_debian) or
        (ansible_facts['os_family'] == 'RedHat' and server_apply_to_redhat)
    - gnome
    - rpmfusion
    - flatpak
    - vscode
    - virtualization
