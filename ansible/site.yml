---
- name: Configure Linux workstation
  hosts: workstation
  become: true

  vars_files:
    - vars.yml

  pre_tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

  roles:
    - base
    - security
    - tailscale
    - firewall
    - role: server
      when: >-
        (ansible_facts['os_family'] == 'Debian' and server_apply_to_debian) or
        (ansible_facts['os_family'] == 'RedHat' and server_apply_to_redhat)
    - role: gnome
      when: "'gnome-shell' in ansible_facts['packages']"
    - rpmfusion
    - flatpak
    - vscode
    - virtualization
