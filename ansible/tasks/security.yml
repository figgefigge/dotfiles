---
- name: Install security packages
  ansible.builtin.dnf:
    name:
      - firewalld
      - selinux-policy
      - selinux-policy-targeted
      - policycoreutils
      - policycoreutils-python-utils
      - dnf-automatic
      - fwupd
      - mokutil
      - audit
      - audit-rules
      - chrony
      - usbguard
      - usbguard-notifier
      - usbguard-selinux
      - clevis
      - clevis-luks
      - clevis-dracut
      - clevis-systemd
      - clevis-udisks2
      - tpm2-tools
    state: present

# ─────────────────────────────
# Secure Boot / TPM / LUKS
# ─────────────────────────────

- name: Check for UEFI
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: efi

- name: Require UEFI
  ansible.builtin.assert:
    that:
      - not require_secure_boot or efi.stat.exists
    fail_msg: >
      Secure Boot is required, but this system does not appear
      to be booted using UEFI.
  when: require_secure_boot

- name: Check Secure Boot state
  ansible.builtin.command:
    cmd: mokutil --sb-state
  register: secure_boot
  changed_when: false
  when:
    - require_secure_boot
    - efi.stat.exists

- name: Require Secure Boot
  ansible.builtin.assert:
    that:
      - "'SecureBoot enabled' in secure_boot.stdout"
    fail_msg: >
      Secure Boot is required but is not enabled.
  when: require_secure_boot

- name: Check TPM device
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: tpm_device

- name: Require TPM
  ansible.builtin.assert:
    that:
      - not require_tpm or tpm_device.stat.exists
    fail_msg: >
      TPM 2.0 device was not found.
  when: require_tpm

- name: Check encrypted block devices
  ansible.builtin.command:
    cmd: lsblk -rno TYPE
  register: block_device_types
  changed_when: false

- name: Require LUKS encryption
  ansible.builtin.assert:
    that:
      - not require_luks or 'crypt' in block_device_types.stdout_lines
    fail_msg: >
      No active dm-crypt device was detected.
  when: require_luks

# ─────────────────────────────
# SELinux
# ─────────────────────────────

- name: Ensure SELinux is enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

# ─────────────────────────────
# Firewall
# ─────────────────────────────

- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Set public as default firewalld zone
  ansible.builtin.command:
    cmd: firewall-cmd --set-default-zone=public
  changed_when: false

- name: Disable SSH in public zone
  ansible.posix.firewalld:
    zone: public
    service: ssh
    state: disabled
    permanent: true
    immediate: true
  when: not ssh_server_enabled

# ─────────────────────────────
# Automatic updates
# ─────────────────────────────

- name: Configure automatic DNF updates
  ansible.builtin.copy:
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [commands]
      upgrade_type = {{ dnf_automatic_upgrade_type }}
      random_sleep = 0
      network_online_timeout = 60
      download_updates = yes
      apply_updates = yes

      [emitters]
      emit_via = motd

      [base]
      debuglevel = 1

- name: Enable automatic updates
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started

# ─────────────────────────────
# Firmware
# ─────────────────────────────

- name: Enable fwupd refresh timer
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    enabled: true
    state: started

# ─────────────────────────────
# Time synchronization
# ─────────────────────────────

- name: Enable chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started


# ─────────────────────────────
# USBGuard
# ─────────────────────────────

- name: Ensure usbguard is installed
  ansible.builtin.dnf:
    name: usbguard
    state: present

- name: Deploy custom usbguard rules
  ansible.builtin.copy:
    src: usbguard-rules.conf
    dest: /etc/usbguard/rules.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart usbguard

- name: Deploy custom usbguard daemon configuration
  ansible.builtin.copy:
    src: usbguard-daemon.conf
    dest: /etc/usbguard/usbguard-daemon.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart usbguard

- name: Ensure USBGuard IPC access control directory exists
  ansible.builtin.file:
    path: /etc/usbguard/IPCAccessControl.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create ACL file user
  ansible.builtin.copy:
    dest: "/etc/usbguard/IPCAccessControl.d/{{ workstation_user }}.conf"
    content: "Devices=list,listen\n"
    owner: root
    group: root
    mode: '0600'
  notify: restart usbguard

- name: Ensure usbguard service is enabled and running
  ansible.builtin.systemd:
    name: usbguard
    state: started
    enabled: true

# ─────────────────────────────
# Audit
# ─────────────────────────────

- name: Install local audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/70-workstation.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      -a always,exit -F arch=b64 -F path=/etc/passwd -F perm=wa -k identity
      -a always,exit -F arch=b64 -F path=/etc/group -F perm=wa -k identity
      -a always,exit -F arch=b64 -F path=/etc/shadow -F perm=wa -k identity
      -a always,exit -F arch=b64 -F path=/etc/gshadow -F perm=wa -k identity

      -a always,exit -F arch=b64 -F path=/etc/sudoers -F perm=wa -k sudoers
      -a always,exit -F arch=b64 -F dir=/etc/sudoers.d -F perm=wa -k sudoers

      -a always,exit -F arch=b64 -F path=/etc/ssh/sshd_config -F perm=wa -k ssh

      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules

- name: Enable auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# ─────────────────────────────
# Journald
# ─────────────────────────────

- name: Configure persistent journald
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      MaxRetentionSec=1month

- name: Ensure journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: root
    mode: "2755"

# ─────────────────────────────
# Network hardening
# ─────────────────────────────

- name: Configure conservative network hardening
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"

    - name: net.ipv4.conf.default.accept_redirects
      value: "0"

    - name: net.ipv4.conf.all.send_redirects
      value: "0"

    - name: net.ipv4.conf.default.send_redirects
      value: "0"

    - name: net.ipv4.conf.all.accept_source_route
      value: "0"

    - name: net.ipv4.conf.default.accept_source_route
      value: "0"

    - name: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"

    - name: net.ipv6.conf.all.accept_redirects
      value: "0"

    - name: net.ipv6.conf.default.accept_redirects
      value: "0"

