---
- name: Configure system sleep and power management states
  tags: [power, systemd]
  block:
    - name: Mask sleep and suspend targets in systemd
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: "{{ server_systemd_mask_sleep_targets }}"
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
      notify: Reload systemd

- name: Configure systemd coredump settings
  tags: [coredump, security, systemd]
  block:
    - name: Template coredump.conf
      ansible.builtin.template:
        src: coredump.conf.j2
        dest: /etc/systemd/coredump.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Disable apport or kernel crash handlers if applicable
      ansible.builtin.service:
        name: apport
        state: stopped
        enabled: false
      when: "'apport.service' in ansible_facts.services"

- name: Apply sysctl server hardening parameters
  ansible.builtin.template:
    src: 99-sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-sysctl-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload sysctl
  tags: [sysctl, security]
