---
- name: Installera RPM Fusion (Free och Nonfree)
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_version }}.noarch.rpm"
    state: present
  become: true

- name: Enable Cisco OpenH264 codec
  ansible.builtin.command:
    cmd: dnf config-manager setopt fedora-cisco-openh264.enabled=1
  become: true
  changed_when: true

- name: Installera RPM Fusion appstream-data för DNF5
  ansible.builtin.dnf:
    name:
      - rpmfusion-free-appstream-data
      - rpmfusion-nonfree-appstream-data
    state: present
  become: true

- name: Swap dnf ffmpeg-free to ffmpeg from RPM Fusion
  ansible.builtin.command:
    cmd: dnf swap -y ffmpeg-free ffmpeg --allowerasing
  become: true
  changed_when: true

# sudo dnf install @multimedia --setopt="install_weak_deps=False" --exclude=PackageKit-gstreamer-plugin
- name: Installera multimedia packages
  ansible.builtin.dnf:
    name:
      - "@multimedia"
    state: present
    install_weak_deps: false
    exclude:
      - PackageKit-gstreamer-plugin
  become: true

- name: Install rpmfusion packages
  ansible.builtin.dnf:
    name: "{{ rpmfusion_packages }}"
    state: present
  become: true
