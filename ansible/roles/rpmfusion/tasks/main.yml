---
- name: Configure RPM Fusion on Fedora
  ansible.builtin.include_tasks: fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Report RPM Fusion is not available on Debian
  ansible.builtin.debug:
    msg: RPM Fusion is Fedora-specific; no repository changes are needed on Debian.
  when: ansible_facts['os_family'] == 'Debian'
