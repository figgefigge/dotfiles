# ─────────────────────────────
# Firmware
# ─────────────────────────────

- name: Enable fwupd refresh timer
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    enabled: true
    state: started

# ─────────────────────────────
# Time synchronization
# ─────────────────────────────

- name: Enable chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started


# ─────────────────────────────
# USBGuard
# ─────────────────────────────

- name: Ensure usbguard service is enabled and running
  ansible.builtin.systemd:
    name: usbguard
    state: started
    enabled: true
  when: usbguard_enabled

