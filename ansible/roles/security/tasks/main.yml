# ─────────────────────────────
# Journald
# ─────────────────────────────

- name: Configure persistent journald
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      MaxRetentionSec=1month

- name: Ensure journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: root
    mode: "2755"
