---
- name: Install Fedora security packages
  ansible.builtin.dnf:
    name:
      - selinux-policy
      - selinux-policy-targeted
      - libselinux
      - libselinux-utils
      - libsemanage
      - policycoreutils
      - policycoreutils-python-utils
      - dnf-automatic
      - fwupd
      - mokutil
      - audit
      - audit-rules
      - chrony
      - clevis
      - clevis-luks
      - clevis-dracut
      - clevis-systemd
      - clevis-udisks2
      - tpm2-tools
      - fido2-tools
      - libfido2
      - usbguard
      - usbguard-selinux
      - usbguard-notifier
      - usbguard-dbus
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Update Debian package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Debian security packages
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
      - auditd
      - chrony
      - clevis
      - clevis-initramfs
      - clevis-luks
      - clevis-systemd
      - clevis-tpm2
      - fido2-tools
      - fwupd
      - libfido2-1
      - mokutil
      - tpm2-tools
      - unattended-upgrades
      - usbguard
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Set secure user umask in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*UMASK\s+'
    line: UMASK 0027
  when: ansible_facts['os_family'] in ['RedHat', 'Debian']
  tags: [security, umask]

# ─────────────────────────────
# Secure Boot / TPM / LUKS
# ─────────────────────────────

- name: Check for UEFI
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: security_efi

- name: Require UEFI
  ansible.builtin.assert:
    that:
      - not require_secure_boot or security_efi.stat.exists
    fail_msg: >
      Secure Boot is required, but this system does not appear
      to be booted using UEFI.
  when: require_secure_boot

- name: Check Secure Boot state
  ansible.builtin.command:
    cmd: mokutil --sb-state
  register: security_secure_boot
  changed_when: false
  when:
    - require_secure_boot
    - security_efi.stat.exists

- name: Require Secure Boot
  ansible.builtin.assert:
    that:
      - "'SecureBoot enabled' in security_secure_boot.stdout"
    fail_msg: >
      Secure Boot is required but is not enabled.
  when: require_secure_boot

- name: Check TPM device
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: security_tpm_device

- name: Require TPM
  ansible.builtin.assert:
    that:
      - not require_tpm or security_tpm_device.stat.exists
    fail_msg: >
      TPM 2.0 device was not found.
  when: require_tpm

- name: Check encrypted block devices
  ansible.builtin.command:
    cmd: lsblk -rno TYPE
  register: security_block_device_types
  changed_when: false

- name: Require LUKS encryption
  ansible.builtin.assert:
    that:
      - not require_luks or 'crypt' in security_block_device_types.stdout_lines
    fail_msg: >
      No active dm-crypt device was detected.
  when: require_luks

- name: Apply sysctl hardening configuration
  ansible.builtin.template:
    src: 99-sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-sysctl-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload security sysctl
  tags: [security, sysctl]

- name: Apply SSH daemon hardening configuration
  tags: [security, ssh]
  block:
    - name: Ensure SSH daemon configuration directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Gather service facts for SSH daemon
      ansible.builtin.service_facts:

    - name: Template SSH daemon hardening configuration
      ansible.builtin.template:
        src: 99-sshd-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-sshd-hardening.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload security sshd

# ─────────────────────────────
# SELinux och AppArmor
# ─────────────────────────────

- name: Ensure SELinux is enforcing on fedora/RHEL/CentOS
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure AppArmor is enabled and running on Debian
  ansible.builtin.service:
    name: apparmor
    enabled: true
    state: started
  when: ansible_facts['os_family'] == 'Debian'

