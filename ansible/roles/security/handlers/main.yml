---
- name: Reload security sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload security sshd
  ansible.builtin.service:
    name: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
    state: reloaded
  when: >-
    ('sshd.service' in ansible_facts.services)
    if ansible_facts['os_family'] == 'RedHat'
    else ('ssh.service' in ansible_facts.services)
